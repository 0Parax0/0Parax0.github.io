<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Min Portfolio | PARAX</title>
  
  <!-- Modern font from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    /* Palette 02 Implementation */
    :root {
      /* Backgrounds */
      --bg-color: #D0FFCE;           /* Light Mint Green */
      --card-bg: #CBEFB6;            /* Soft Pale Green */
      --card-hover: #b8e6a0;         /* Slightly darker mint tone for hover state */
      
      /* Text Colors */
      --text-main: #34283c;          /* Deep Purple/Slate for crisp text contrast */
      --text-muted: #827191;         /* Muted Purple from palette */
      
      /* Highlights & Accents */
      --accent-gradient: linear-gradient(135deg, #9A031E 0%, #84ACCE 100%); /* Crimson to Soft Blue */
      --accent-color: #9A031E;       /* Vibrant Crimson Red */
      --accent-secondary: #84ACCE;   /* Soft Blue */
      --border-color: #84ACCE;       /* Soft Blue border */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 60px 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 720px;
      width: 100%;
    }

    /* Hero Header */
    header {
      margin-bottom: 48px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      margin-bottom: 12px;
    }

    h1 em {
      font-style: normal;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 1.125rem;
      color: var(--text-muted);
    }

    .subtitle strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Section Styles */
    section {
      margin-bottom: 40px;
    }

    h2 {
      font-size: 1.25rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    /* Projects Grid */
    .project-card {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: var(--text-main);
      transition: all 0.2s ease-in-out;
    }

    .project-card:hover {
      background-color: var(--card-hover);
      transform: translateY(-2px);
      border-color: var(--accent-color);
    }

    .project-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .project-info p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .project-link-icon {
      font-weight: bold;
      color: var(--accent-color);
      font-size: 1.2rem;
    }

    /* Contact Section */
    .contact-box {
      background-color: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: rgba(130, 113, 145, 0.15); /* Translucent muted purple */
      color: var(--accent-color);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
      word-break: break-all;
      display: inline-block;
      margin-top: 4px;
      font-weight: 600;
    }

    /* Responsive adjustment */
    @media (max-width: 480px) {
      h1 { font-size: 2rem; }
      body { padding: 32px 16px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Hei, jeg heter <em>PARAX</em> 👋</h1>
      <p class="subtitle">Dette er min første nettside publisert med <strong>GitHub Pages</strong>.</p>
    </header>

    <main>
      <section>
        <h2>Prosjekter</h2>
        <a class="project-card" href="https://www.youtube.com/watch?v=HIcSWuKMwOw" target="_blank" rel="noopener noreferrer">
          <div class="project-info">
            <h3>Parax Art Station</h3>
            <p>Se prosjektet på YouTube</p>
          </div>
          <span class="project-link-icon">↗</span>
        </a>
      </section>

      <section>
        <h2>Kontakt</h2>
        <div class="contact-box">
          <p>Send meg en e-post:</p>
          <code>0parax0.github.io-po.doorknob081@passmail.net</code>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
